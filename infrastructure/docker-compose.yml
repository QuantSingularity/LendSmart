# docker-compose.yml - Local development environment
# Usage:
#   cp .env.example .env         # fill in your values
#   docker compose up --build

version: "3.9"

services:
  # ── Database (MongoDB - matches the backend's mongoose driver) ──────────────
  database:
    build:
      context: .
      dockerfile: docker/Dockerfile.database
    container_name: lendsmart-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-lendsmartdb}
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lendsmart-net

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: lendsmart-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lendsmart-net

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../code/backend
      dockerfile: ../../infrastructure/docker/Dockerfile.backend
    container_name: lendsmart-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@database:27017/${MONGO_DATABASE:-lendsmartdb}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-prod}
      API_KEY: ${API_KEY:-dev-api-key}
    ports:
      - "3000:3000"
    volumes:
      - ../code/backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - lendsmart-net

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../web-frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
      args:
        REACT_APP_API_URL: /api
        REACT_APP_ENV: development
    container_name: lendsmart-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - lendsmart-net

volumes:
  db_data:
  redis_data:

networks:
  lendsmart-net:
    driver: bridge
