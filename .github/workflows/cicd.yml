name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier@3.9.1 prettier-plugin-solidity

      - name: Run Global Quality Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check for all supported files ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

      - name: Finalize Check
        run: echo "All formatting checks completed successfully."

  # ============================================================
  # Job 2 -- Backend Tests
  # ============================================================
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/backend

    env:
      NODE_ENV: test
      SKIP_REDIS: "true"
      SKIP_DB_CONNECTION: "true"
      LOG_LEVEL: error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Jest test suite with coverage
        timeout-minutes: 5
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage/
          retention-days: 14

      - name: Print coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "=== Coverage summary ==="
            node -e "
              const fs = require('fs');
              const lcov = fs.readFileSync('coverage/lcov.info', 'utf8');
              const lines = lcov.split('\n');
              let lf = 0, lh = 0;
              lines.forEach(l => {
                if (l.startsWith('LF:')) lf += parseInt(l.slice(3));
                if (l.startsWith('LH:')) lh += parseInt(l.slice(3));
              });
              const pct = lf ? ((lh / lf) * 100).toFixed(1) : '0.0';
              console.log('Lines covered : ' + lh + ' / ' + lf + ' (' + pct + '%)');
            "
          else
            echo "No lcov.info found -- skipping summary."
          fi

  # ============================================================
  # Job 3 -- Backend Build (Docker image + container smoke test)
  # ============================================================
  backend_build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend_tests

    env:
      IMAGE_NAME: lendsmart-backend
      CONTAINER_NAME: lendsmart-backend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code/backend
          file: code/backend/Dockerfile
          target: production
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs as a non-root user
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "${IMAGE_NAME}:ci" -u)
          echo "Container user id: ${uid}"
          if [ "${uid}" = "0" ]; then
            echo "Image must not run as root." >&2
            exit 1
          fi

      - name: Smoke test the built image
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 3000:3000 \
            -e JWT_SECRET=ci-smoke-test-jwt-secret \
            -e REFRESH_TOKEN_SECRET=ci-smoke-test-refresh-secret \
            -e ENCRYPTION_MASTER_KEY=ci-smoke-test-encryption-master-key-0123456789 \
            -e SKIP_DB_CONNECTION=true \
            "${IMAGE_NAME}:ci"

          echo "=== Waiting for backend to respond ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health -o response.txt; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Backend did not become ready in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "=== Response ==="
          head -c 600 response.txt
          echo
          grep -q '"status":"healthy"' <(tr -d ' \n' < response.txt) || {
            echo "Health endpoint did not report healthy." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          }

      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 4 -- Smart Contract Compile & Test
  # ============================================================
  blockchain_tests:
    name: Smart Contract Compile & Test
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run Hardhat test suite
        timeout-minutes: 10
        run: npm test

      - name: Upload compiled contract artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: code/blockchain/artifacts/
          retention-days: 14

  # ============================================================
  # Job 5 -- Web Build
  # ============================================================
  web_build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7
